name: Authorized Convergence01 source publication
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/c01-source-publication.yml'
      - 'docs/engineering/rvb22/publication/c01/**'
permissions:
  contents: write
concurrency:
  group: c01-source-publication-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.head_ref == 'codex/rvb24-coordinated-closure' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Restore exact authorized source with preimage checks
        run: python3 docs/engineering/rvb22/publication/c01/import_source.py
      - name: Provision isolated test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/c01-env"
          "$RUNNER_TEMP/c01-env/bin/python" -m pip install -r docs/engineering/rvb22/analyses/convergence_01/requirements.txt
      - name: Repeat source-sensitive and actual-function firmware checks
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          mkdir -p publication_evidence
          PY="$RUNNER_TEMP/c01-env/bin/python"
          D=docs/engineering/rvb22/analyses/convergence_01
          "$PY" -m unittest discover -s "$D/tests" -v 2>&1 | tee publication_evidence/tests.log
          "$PY" "$D/firmware_regression.py" --firmware-dir docs/engineering/rvb22/candidate/firmware --out publication_evidence/firmware
      - name: Commit only verified engineering source to the same branch
        env:
          TARGET_BRANCH: codex/rvb24-coordinated-closure
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git add -- docs/engineering/rvb22
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish verified Convergence01 source and evidence without adopting CAD trials'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > publication_evidence/published-commit.txt
      - name: Preserve test and publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c01-publication-${{ github.event.pull_request.head.sha }}
          path: publication_evidence/
          retention-days: 14
          if-no-files-found: error
