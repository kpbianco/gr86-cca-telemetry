name: I26 register audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/rvb24-coordinated-closure'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Audit controlled register
        run: python3 docs/engineering/rvb22/i26_audit_open_rows.py | tee i26-register-audit.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i26-register-audit-${{ github.sha }}
          path: i26-register-audit.log
          retention-days: 14
