name: RVB22 native engineering review
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rvb22-native.yml'
      - 'docs/engineering/rvb22/runtime/**'
      - 'docs/engineering/rvb22/candidate/cad/**'
      - 'docs/engineering/rvb22/candidate/firmware/**'
permissions:
  contents: read
concurrency:
  group: rvb22-native-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  native:
    if: github.head_ref == 'codex/rvb22-corrective-engineering' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record exact candidate revision
        run: |
          mkdir -p native_setup
          git rev-parse HEAD > native_setup/commit.txt
      - name: Provision pinned native toolchain
        run: bash docs/engineering/rvb22/runtime/hosted/setup_native.sh
      - name: Run CAD verification and target firmware compilation
        run: |
          xvfb-run -a /usr/bin/python3 docs/engineering/rvb22/runtime/run_native_candidate.py \
            --cad-dir docs/engineering/rvb22/candidate/cad \
            --firmware-dir docs/engineering/rvb22/candidate/firmware \
            --output native_I06_hosted \
            --kicad-cli kicad-cli \
            --pcbnew-python /usr/bin/python3 \
            --arduino-cli "${RUNNER_TEMP}/rvb22-native-tools/bin/arduino-cli" \
            --arduino-config "${RUNNER_TEMP}/rvb22-native-tools/config/arduino-cli.yaml" \
            --nimble-dir "${RUNNER_TEMP}/rvb22-native-tools/user/libraries/NimBLE-Arduino" \
            --component-step
      - name: Preserve returned evidence and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rvb22-native-${{ github.event.pull_request.head.sha }}
          path: |
            native_setup/
            native_I06_hosted/
          retention-days: 7
          if-no-files-found: error
